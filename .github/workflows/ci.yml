name: CI — Offline Pipeline Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Syntax check eval_boq.js
        run: node --check scripts/eval_boq.js

      - name: Run dashboard linter
        run: npm --workspace dashboard run lint

      - name: Run dashboard component tests
        run: npm --workspace dashboard test -- --run

      - name: Run offline pipeline tests
        run: node tests/test_offline_pipeline.js

      - name: Bootstrap Gen12 golden catalog
        run: npm run bootstrap:gen12

      - name: Certify Gen12 golden catalog
        run: npm run certify:gen12

      - name: Run SKU regex & category tests
        run: node scripts/test_all_aspects.js

      - name: Run conflict graph tests
        run: node tests/test_conflict_graph.js

      - name: Run end-to-end scenarios tests
        run: node tests/test_end_to_end_scenarios.js

      - name: Run vendor portal BOM verification tests
        run: node tests/test_vendor_bom_verifier.js

      - name: Run Gemini rotator FIFO & quota tests
        run: node tests/test_gemini_rotator.js

      - name: Run incremental checksum & diff tests
        run: node tests/test_incremental_checksum.js

      - name: Run edge cases & robustness tests
        run: node tests/test_edge_cases.js

      - name: Run chaos & failure modes resilience tests
        run: node tests/test_failure_modes_and_chaos.js

      - name: Run historical pricing timeline tests
        run: node tests/test_historical_pricing_timeline.js

      - name: Run Master Excel alignment & audit tests
        run: node tests/test_excel_alignment_and_audit.js

      - name: Run full multi-family portfolio certification
        run: node scripts/verify_all.js
