name: HPE BOQ Evaluator & Dashboard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root & dashboard dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Static Lint (dashboard + core scripts/tests)
        run: |
          npm run lint
          npm run lint:core

      - name: Cyclomatic Complexity <= 30 & Circular Dependency Gates
        run: |
          npm run lint:complexity
          npm run test:circular

      - name: Build Dashboard Production Bundle
        run: npm run build

      - name: Run Dashboard Component Tests (Vitest)
        run: npm --workspace dashboard test -- --run

      - name: Run Core & Release-Gate Regression Suites
        run: |
          npm run test:smoke
          node --test tests/unit/test_offline_policy_enforcement.js tests/unit/test_export_authorization_and_candidate_binding.js tests/unit/test_run_recovery_and_sizing_context.js
          node tests/unit/test_topology_builder.js
          node tests/integration/test_dashboard_workflow_reliability.js

      - name: Run Isolated Offline Browser Release Gate (Orders 1-5)
        env:
          OFFLINE_MODE: '1'
          LOCAL_EVAL_ONLY: '1'
        run: node scripts/maintenance/test_dashboard_browser_e2e.js

      - name: Run Isolated Offline Portfolio E2E
        env:
          OFFLINE_MODE: '1'
          LOCAL_EVAL_ONLY: '1'
        run: node tests/e2e/test_dashboard_full_portfolio_e2e.js

      - name: Upload Dashboard Release Gate Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-release-gate-evidence
          path: |
            outputs/history/dashboard_release_evidence.json
            outputs/history/screenshots_e2e/
          if-no-files-found: warn
