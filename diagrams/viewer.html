  <style>
    :root {
      --bg: #070b14;
      --card-bg: #0d1527;
      --card-border: #1e293b;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --sidebar-w: 360px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--card-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(13, 21, 39, 0.95);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      margin-bottom: 8px;
    }
    .sidebar-header h1 {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .search-box {
      margin-top: 12px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: #070b14;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }
    .nav-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 8px 8px 6px;
      margin-top: 8px;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 500;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 3px;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }
    .nav-item.active {
      background: var(--accent-glow);
      border-color: rgba(16, 185, 129, 0.4);
      color: #10b981;
      font-weight: 600;
    }

    /* Main Content Area */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #0b1120;
      position: relative;
    }
    .top-bar {
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: #0d1527;
      z-index: 10;
    }
    .diagram-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .diagram-tag {
      font-size: 11px;
      background: #1e293b;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      margin-left: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hint-text {
      font-size: 12px;
      color: #64748b;
      margin-right: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .action-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn:hover {
      background: #334155;
      color: #fff;
      border-color: #64748b;
    }
    .action-btn.primary {
      background: #065f46;
      color: #6ee7b7;
      border-color: #059669;
    }
    .action-btn.primary:hover {
      background: #047857;
      color: #fff;
    }

    /* Infinite Canvas Viewport */
    .viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      overflow: hidden;
      position: relative;
      cursor: grab;
      background-image: 
        radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .viewport:active {
      cursor: grabbing;
    }
    #mermaidTarget {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mermaidTarget svg {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
    }

    /* High-Contrast Crisp Mermaid Styling */
    .mermaid .node rect, 
    .mermaid .node circle, 
    .mermaid .node polygon {
      fill: #1e293b !important;
      stroke: #10b981 !important;
      stroke-width: 2px !important;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }
    .mermaid .cluster rect {
      fill: #0f172a !important;
      stroke: #334155 !important;
      stroke-width: 1.5px !important;
      rx: 12px !important;
    }
    .mermaid text {
      font-family: 'Inter', sans-serif !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      fill: #ffffff !important;
    }
    .mermaid .cluster text {
      font-size: 16px !important;
      font-weight: 800 !important;
      fill: #34d399 !important;
      letter-spacing: -0.01em;
    }
    .mermaid .edgeLabel {
      background-color: #0f172a !important;
      color: #38bdf8 !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      padding: 4px 8px !important;
      border-radius: 6px !important;
      border: 1px solid #1e293b !important;
    }
    .mermaid .edgePath path {
      stroke: #38bdf8 !important;
      stroke-width: 2px !important;
    }
    .mermaid .arrowheadPath {
      fill: #38bdf8 !important;
    }
    .mermaid .actor {
      fill: #1e293b !important;
      stroke: #10b981 !important;
      stroke-width: 2px !important;
    }
    .mermaid text.actor > tspan {
      fill: #ffffff !important;
      font-weight: 700 !important;
      font-size: 15px !important;
    }
    .mermaid .messageText {
      fill: #e2e8f0 !important;
      font-size: 13px !important;
      font-weight: 500 !important;
    }
    .mermaid .note {
      fill: #1e1b4b !important;
      stroke: #818cf8 !important;
      stroke-width: 1.5px !important;
    }
    .mermaid .noteText {
      fill: #e0e7ff !important;
      font-weight: 600 !important;
    }
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
    }
  </style>

    const diagrams = [{"id":"doc_01","cat":"fromDocs","name":"1. Hybrid dual brain architecture","file":"01_hybrid_dual_brain_architecture.md","code":"graph TB\n    subgraph \"Customer Input Layer\"\n        A1[\"📄 Customer BOQ<br/>(Excel / CSV / TSV / Raw Text)\"]\n        A2[\"🖼️ Multimodal Quote Image / PDF<br/>(Scanned RFP / iQuote)\"]\n    end\n\n    subgraph \"Ingestion & Pre-Processing Subsystem\"\n        B1[\"Multimodal Vision OCR Service<br/>(ocr_service.js)\"]\n        B2[\"CTO Normalization & Parsing Engine<br/>(boq_preprocessor.js + boq_parser.js)\"]\n        B3[\"5-Stage Cleansing Pipeline<br/>(Header Offset, Line Consolidation, Multipliers)\"]\n    end\n\n    subgraph \"Infrastructure: Gemini Key Rotator (FIFO Pool)\"\n        KR[\"Smart Key Rotator (gemini_rotator.js)<br/>Deterministic FIFO Queue + Daily Quota Demotion\"]\n    end\n\n    subgraph \"Brain 1: Deterministic Physical Rule Engine (Local & Offline)\"\n        D1[\"Aspect 1: Compute & Thermal Math<br/>(TDP Watts vs Fan Kits)\"]\n        D2[\"Aspect 2: Memory Channel Symmetry<br/>(8 Channels/Socket, 1DPC/2DPC)\"]\n        D3[\"Aspect 3: Storage Tri-Mode & Battery<br/>(RAID Cache Battery & Drive Kits)\"]\n        D4[\"Aspect 4: PCIe Slots & Riser Bifurcation<br/>(Lanes vs Riser Cards)\"]\n        D5[\"Aspect 5: Power Infrastructure<br/>(PSU Wattage Redundancy & DC Lugs)\"]\n        D6[\"Aspect 6: Networking & OCP Slots<br/>(OCP 3.0 Occupancy & Ports)\"]\n        D7[\"Aspect 7: Support & Services SLA<br/>(Pointnext & Tech Care Validation)\"]\n        CG[\"5-Level Conflict Graph & Capacity DAG<br/>(conflict_graph.js)\"]\n    end\n\n    subgraph \"Brain 2: Intent, Verification & Grounding Brain\"\n        NLM[\"Google NotebookLM RAG<br/>(Official QuickSpecs Grounding)\"]\n        LOCAL_RAG[\"Local Dual-Layer Fallback Search<br/>(local_rag_search.js)\"]\n        GUARDRAIL[\"Agentic MCP Guardrail Loop<br/>(agentic_guardrail.js)\"]\n        SIM[\"Build Simulator & Fix Verifier<br/>(simulate_build Tool — Full Multi-Aspect Re-run)\"]\n    end\n\n    subgraph \"Output & Synthesis Layer\"\n        MATRIX[\"5-Tier Strategic Resolution Matrix<br/>(Rank 1: Intent Preserved ... Rank 5: Budget Minimized)\"]\n        DASHBOARD[\"React Control Center Dashboard<br/>(Real-Time SSE Stream)\"]\n        EXCEL[\"Corrected Multi-Sheet Excel BOM<br/>(generate_boq_xlsx.js)\"]\n        LEDGER[\"Telemetry Ledger & Action Log<br/>(pipeline_telemetry.json)\"]\n    end\n\n    %% Connections\n    A1 --> B2\n    A2 --> B1\n    KR -.->|Active API Key| B1\n    KR -.->|Active API Key| GUARDRAIL\n    KR -.->|Active API Key| LOCAL_RAG\n    B1 --> B2\n    B2 --> B3\n    B3 --> D1 & D2 & D3 & D4 & D5 & D6 & D7\n    D1 & D2 & D3 & D4 & D5 & D6 & D7 --> CG\n\n    CG -->|Confidence == 1.0 & Clean| MATRIX\n    CG -->|Confidence < 1.0 or Unresolved| GUARDRAIL\n\n    GUARDRAIL <-->|Query Grounding| NLM\n    NLM -.->|If Cloud Offline| LOCAL_RAG\n    GUARDRAIL <-->|Iterative Simulation| SIM\n    SIM <--> D1 & D2 & D3 & D4 & D5 & D6 & D7\n\n    GUARDRAIL -->|Resolved Output| MATRIX\n    MATRIX --> DASHBOARD\n    MATRIX --> EXCEL\n    MATRIX --> LEDGER"},{"id":"doc_02","cat":"fromDocs","name":"2. Six stage boq evaluation workflow","file":"02_six_stage_boq_evaluation_workflow.md","code":"sequenceDiagram\n    autonumber\n    actor Customer as Customer / Presales\n    participant UI as React Control Center\n    participant API as Express API Server\n    participant Preproc as Preprocessor & OCR\n    participant Math as 6-Aspect Math Engine\n    participant Graph as 5-Level Conflict Graph\n    participant Agent as Agentic Guardrail (MCP)\n    participant NLM as NotebookLM / Local RAG\n    participant Syn as Strategy Synthesizer\n    participant Out as Exporter & Telemetry\n\n    Note over Customer,UI: Stage 1: Upload & Multi-Format Ingestion\n    Customer->>UI: Uploads BOQ (Excel / CSV / Image / Text)\n    UI->>API: POST /api/upload-boq (Multipart Disk Storage)\n    API->>Preproc: Read Raw Payload\n\n    Note over Preproc,API: Stage 2: 5-Stage Cleansing & Pre-flight Normalization\n    alt Is Image / Scanned PDF\n        Preproc->>Preproc: performGeminiOcr() with Key Rotation\n    end\n    Preproc->>Preproc: 1. Strip Header & Preamble Rows\n    Preproc->>Preproc: 2. Normalize Delimiters (Tabs, Pipes, Columns)\n    Preproc->>Preproc: 3. Detect Server Node Multipliers (e.g. 2x Nodes)\n    Preproc->>Preproc: 4. Extract Canonical HPE SKUs (isValidHpeSKU)\n    Preproc->>Preproc: 5. Detect Multi-Configuration Splits (Clustering)\n    Preproc-->>UI: Broadcast Cleansing Telemetry via SSE\n\n    Note over Math,Graph: Stage 3: Deterministic Physical Aspect Pre-Checks\n    API->>Math: evaluatePhysicalMath(items)\n    par Check 7 Physical & Service Aspects\n        Math->>Math: Aspect 1: Compute & TDP (Watts vs High-Perf Fans)\n        Math->>Math: Aspect 2: Memory Channels (1DPC/2DPC, x4/x8 mixing)\n        Math->>Math: Aspect 3: Storage Tri-Mode (RAID Controller Battery)\n        Math->>Math: Aspect 4: PCIe Expansion (Risers vs Add-in Cards)\n        Math->>Math: Aspect 5: Power Environment (-48VDC Lug Kits)\n        Math->>Math: Aspect 6: Networking (OCP 3.0 Port Allocations)\n        Math->>Math: Aspect 7: Support & Services SLA (Pointnext & Tech Care)\n    end\n    Math->>Graph: validateConflictGraph(items, missingDependencies)\n    Graph->>Graph: Check VENDOR, CHASSIS, CATEGORY, SUBCAT, SKU rules\n    Graph->>Graph: Compute Confidence Score (0.0 to 1.0)\n\n    Note over Graph,Agent: Stage 4: Dual-Brain Resolution & Guardrail Loop\n    alt Confidence Score >= 0.75 & Zero Critical Conflicts\n        Graph->>Syn: Proceed Directly to Solution Synthesis\n    else Confidence Score < 0.75 or Missing Mandatory Dependencies\n        Graph->>Agent: Trigger Agentic MCP Guardrail\n        loop Autonomous Resolution Loop (Max 5 iterations)\n            Agent->>NLM: Query QuickSpecs Rule Grounding\n            NLM-->>Agent: Authoritative Hardware Constraints\n            Agent->>Agent: Tool: simulate_build(modifiedSKUs)\n            Agent->>Agent: Tool: search_catalog(category, query)\n            Agent->>Agent: Inject Mandatory Fixes (e.g. Fan Kit P48820-B21)\n        end\n        Agent->>Syn: Return Validated Whole-Solution BOM\n    end\n\n    Note over Syn,Out: Stage 5: 5-Tier Strategy Resolution Matrix Synthesis\n    Syn->>Syn: Synthesize Rank 1: Customer Workload Intent Preserved\n    Syn->>Syn: Synthesize Rank 2: Standardized CTO Baseline\n    Syn->>Syn: Synthesize Rank 3: Performance Max (High-IOPS / Clock)\n    Syn->>Syn: Synthesize Rank 4: Density Max (Future Scalability)\n    Syn->>Syn: Synthesize Rank 5: Budget Minimized (Lowest CapEx)\n\n    Note over Out,UI: Stage 6: Multi-Modality Output & Ledger Persistence\n    Syn->>Out: Generate 19-Sheet Corrected Excel BOM (generate_boq_xlsx.js)\n    Syn->>Out: Append Run Trace to pipeline_telemetry.json\n    Out->>API: Broadcast EVAL_RESULT via SSE Stream\n    API-->>UI: Render 5-Tier Matrix, Tradeoffs & Aspect Badges\n    UI-->>Customer: Visual Review, Excel Download & Partner Portal Export"},{"id":"doc_03","cat":"fromDocs","name":"3. Five tier strategy resolution matrix","file":"03_five_tier_strategy_resolution_matrix.md","code":"graph TD\n    subgraph \"Input Context & Profile\"\n        RAW_BOM[\"Normalized Customer Base BOM<br/>(SKUs, Quantities, Unit Prices)\"]\n        DNA[\"Workload DNA Profiler<br/>• Primary Workload (Compute / DB / VDI)<br/>• RAM/Core Ratio (GB/Core)<br/>• Accelerator Presence (GPU / SmartNIC)<br/>• Storage IOPS Tier (NVMe / SAS)\"]\n        FIXES[\"Mandatory Injected Fixes<br/>(Thermal Fans, Battery Kits, DC Lugs)\"]\n        CATALOG_PRICES[\"Master Catalog Price History<br/>(price_history.json)\"]\n    end\n\n    subgraph \"Mathematical Budget Calculator\"\n        BC[\"Base BOM Cost = Σ(Base SKU Price × Qty)\"]\n        FC[\"Fix Cost = Σ(Mandatory Fix SKU Price × Qty)\"]\n    end\n\n    subgraph \"5-Tier Strategy Synthesizer\"\n        R1[\"<b>Rank 1: Customer Workload Intent Preserved (Optimal Match)</b><br/>• Preserves exact compute & memory specifications<br/>• Injects ONLY mandatory buildability fixes<br/>• Budget: Base BOM Cost + Fix Cost ($0 Addon Surplus)\"]\n\n        R2[\"<b>Rank 2: Standard Baseline & Factory Default Accessories</b><br/>• Aligns with standard CTO chassis baseline configuration<br/>• Standard factory default accessories & redundant power<br/>• Budget: Baseline Cost + Fix Cost + Standard Addons\"]\n\n        R3[\"<b>Rank 3: High-IOPS & Storage Performance Optimized</b><br/>• Upgrades to High-Performance NVMe / High-Clock Processors<br/>• Tuned for maximum transactional & computational throughput<br/>• Budget: Performance Optimized Premium Tier\"]\n\n        R4[\"<b>Rank 4: Maximum Density & Scalability Expansion</b><br/>• Maximizes DIMM slot occupancy & storage backplane bays<br/>• Built for 3-5 year future scale-up capacity without chassis swaps<br/>• Budget: Maximum Density Scale Tier\"]\n\n        R5[\"<b>Rank 5: Budget & CapEx Minimized Buildable Baseline</b><br/>• Strips all optional non-essential accessories & bundles<br/>• Minimum viable 100% buildable certified configuration<br/>• Budget: Lowest Possible CapEx expenditure\"]\n    end\n\n    subgraph \"Tradeoff & Validation Engine\"\n        DEDUP[\"Deduplication & Validation Filter<br/>(Guarantees exactly 5 unique, non-colliding solution tiers)\"]\n        METRICS[\"Tradeoff Metrics Engine<br/>• Intent Alignment % (100% down to 65%)<br/>• SKU Modifications Count<br/>• Cost Delta USD ($)<br/>• Capacity Expansion Rating\"]\n        RAG_CHECK[\"QuickSpecs Grounding Verification<br/>(NotebookLM Secondary Validation)\"]\n    end\n\n    subgraph \"Render & Serialization\"\n        UI_MATRIX[\"Interactive UI Comparison Table<br/>(ResolutionMatrix.jsx)\"]\n        EXCEL_MATRIX[\"Multi-Sheet Corrected Excel Workbook<br/>(generate_boq_xlsx.js)\"]\n    end\n\n    %% Flow\n    RAW_BOM & DNA & FIXES & CATALOG_PRICES --> BC & FC\n    BC & FC --> R1 & R2 & R3 & R4 & R5\n    R1 & R2 & R3 & R4 & R5 --> DEDUP\n    DEDUP --> METRICS\n    METRICS --> RAG_CHECK\n    RAG_CHECK --> UI_MATRIX & EXCEL_MATRIX"},{"id":"doc_04","cat":"fromDocs","name":"4. Zero touch cdp scraping lifecycle","file":"04_zero_touch_cdp_scraping_lifecycle.md","code":"stateDiagram-v2\n    [*] --> StandaloneChromeLaunch : 1. User launches persistent Chrome with remote debugging on port 9222\n\n    state \"Phase 1: Human SSO & Portal Entry (Zero-Touch Boundary)\" as P1 {\n        StandaloneChromeLaunch --> HumanSSOLogin : Opens partner.hpe.com\n        HumanSSOLogin --> NavigatesToOCA : User completes 2FA / SSO & clicks OCA link\n        NavigatesToOCA --> PageLoadedInCDP : OCA WebLogic Configuration page loaded\n    }\n\n    state \"Phase 2: Automated CDP Attachment & DOM Traversal\" as P2 {\n        PageLoadedInCDP --> ConnectCDPPort9222 : Scraper connects to http://127.0.0.1:9222/json\n        ConnectCDPPort9222 --> AutoDismissModals : Smart Auto-Accept (Dismiss Partner Portal Modals)\n        AutoDismissModals --> DeepDOMExtraction : Recursively traverse Category & Subcategory tables\n        DeepDOMExtraction --> ExtractAttributes : Extract SKU, Description, Option Type, List Price, Constraints\n    }\n\n    state \"Phase 3: Staging Isolation & Pre-Commit Validation\" as P3 {\n        ExtractAttributes --> WriteToStagingDir : Save raw scrape to /outputs/temp/staging_{chassis}/\n        WriteToStagingDir --> SchemaValidation : Validate against CatalogMasterSchema (Zod)\n        SchemaValidation --> FormatAudit : Enforce clean regex (isValidHpeSKU, numeric Current Qty)\n        FormatAudit --> PriceTrailDiff : Calculate SHA-256 Checksum Diff & Price History Trails\n    }\n\n    state \"Phase 4: 100% Quality Certification Gate\" as P4 {\n        PriceTrailDiff --> RunPortfolioAudit : Execute 15-check Excel & JSON audit (verify_all.js)\n        state check_gate <<choice>>\n        RunPortfolioAudit --> check_gate\n        check_gate --> AbortRollback : ❌ Any validation failure\n        check_gate --> AtomicPromotion : ✅ 100% PASS (Zero warnings/errors)\n    }\n\n    state \"Phase 5: Master Promotion & Cloud RAG Sync\" as P5 {\n        AtomicPromotion --> SafeWriteJsonAtomic : safeWriteJsonAtomic() -> outputs/{Family}/{Gen}/{Model}/\n        SafeWriteJsonAtomic --> GenerateMasterExcel : Generate 19-sheet Master Excel Workbook\n        GenerateMasterExcel --> KnowledgeSync : Build Markdown Charter & Upload to Google NotebookLM\n        KnowledgeSync --> TelemetryLedger : Log Action Ledger & Benchmark KPIs\n    }\n\n    AbortRollback --> [*] : Staging cleaned up, production outputs protected\n    TelemetryLedger --> [*] : Certified Scrape Complete"},{"id":"doc_05","cat":"fromDocs","name":"5. Closed loop feedback and learning","file":"05_closed_loop_feedback_and_learning.md","code":"graph TD\n    subgraph \"Validation Trial & Error Detection\"\n        PORTAL[\"HPE Partner Portal / OCA UI Trial<br/>(Presales Engineer tests BOM configuration)\"]\n        REJECT[\"Portal Rejection / CLIC Error<br/><i>e.g. 'ERR_STORAGE_BATTERY: MR416i-o requires P01366-B21'</i>\"]\n        HITL[\"Human-in-the-Loop Feedback Drawer<br/>(POST /api/feedback — User submits error message)\"]\n    end\n\n    subgraph \"Feedback Processing & Rule Ingestion Engine\"\n        F_PROCESS[\"processPortalFeedback() Engine<br/>(scripts/lib/feedback_loop.js)\"]\n        REGEX_EXTRACT[\"Error Pattern & SKU Extractor<br/>• Affected SKU: P55415-B21<br/>• Required Dependency SKU: P01366-B21<br/>• Error Classification: PERMANENT_PHYSICAL_DEPENDENCY\"]\n        TAXONOMY[\"Scope Taxonomy Classifier<br/>1. UNIVERSAL_VENDOR (All HPE servers)<br/>2. FAMILY_GEN (e.g. ProLiant Gen12)<br/>3. CHASSIS_SPECIFIC (e.g. DL380 8SFF)\"]\n    end\n\n    subgraph \"Atomic Persistence & Master Knowledge Registry\"\n        SAFE_WRITE[\"safeWriteJsonAtomic()<br/>(Transactional JSON write)\"]\n        CHASSIS_DELTAS[\"Chassis Local History<br/>outputs/{Chassis}/history/catalog_deltas.json\"]\n        MASTER_REGISTRY[\"Master Knowledge Registry<br/>outputs/history/master_knowledge_registry.json\"]\n    end\n\n    subgraph \"Dual RAG Knowledge Synchronization\"\n        DRIFT[\"inspectKnowledgeDrift()<br/>(Compares SHA-256 hashes & detected deltas)\"]\n        PAYLOAD_BUILD[\"generateNotebookSyncPayload()<br/>(Clean Markdown Charter Note with Discontinued & Diffs)\"]\n        NLM_DELETE[\"Delete Stale Source via lastSyncedSourceId\"]\n        NLM_UPLOAD[\"nlm CLI: Upload Fresh Markdown Charter Note to NotebookLM\"]\n        LOCAL_INDEX[\"Local RAG Dual-Layer Search Index<br/>(scripts/lib/local_rag_search.js)\"]\n    end\n\n    subgraph \"Next BOQ Evaluation Run (Self-Healing Rule Application)\"\n        EVAL[\"Deterministic 7-Aspect Math Engine<br/>(scripts/lib/boq_evaluator.js)\"]\n        AUTO_FIX[\"Autonomous Pre-Check Injection<br/>✅ P01366-B21 auto-injected before customer sees error!\"]\n    end\n\n    %% Flows\n    PORTAL --> REJECT\n    REJECT --> HITL\n    HITL --> F_PROCESS\n    F_PROCESS --> REGEX_EXTRACT\n    REGEX_EXTRACT --> TAXONOMY\n    TAXONOMY --> SAFE_WRITE\n    SAFE_WRITE --> CHASSIS_DELTAS\n    CHASSIS_DELTAS --> MASTER_REGISTRY\n    MASTER_REGISTRY --> DRIFT\n    DRIFT --> PAYLOAD_BUILD\n    PAYLOAD_BUILD --> NLM_DELETE --> NLM_UPLOAD\n    PAYLOAD_BUILD --> LOCAL_INDEX\n    MASTER_REGISTRY --> EVAL\n    EVAL --> AUTO_FIX"},{"id":"doc_06","cat":"fromDocs","name":"6. Gemini smart fifo rotator state machine","file":"06_gemini_smart_fifo_rotator_state_machine.md","code":"stateDiagram-v2\n    [*] --> InitializeQueue : Read GEMINI_API_KEY from .env (Comma-separated pool)\n\n    state \"FIFO Pool Initialization\" as InitState {\n        InitializeQueue --> LoadDailyUsageJSON : Read outputs/history/gemini_key_usage.json\n        LoadDailyUsageJSON --> CheckUTCRollover : Compare stored calendar day vs current UTC day\n        CheckUTCRollover --> ResetCounters : UTC day changed -> Reset all daily quota counters to 0\n        CheckUTCRollover --> RetainCounters : Same day -> Retain usage counts & exhausted flags\n        ResetCounters --> QueueReady : All keys marked ACTIVE in FIFO order\n        RetainCounters --> QueueReady\n    }\n\n    state \"Request Execution Lifecycle\" as ExecState {\n        QueueReady --> SelectHeadKey : Peek active key at Position 1 (Head of Queue)\n        SelectHeadKey --> ExecuteAPIRequest : Call Gemini 3.5 Flash / Gemini Vision OCR\n\n        state request_check <<choice>>\n        ExecuteAPIRequest --> request_check\n\n        request_check --> RecordSuccess : 200 OK (Successful inference)\n        request_check --> HandleQuotaError : 429 RESOURCE_EXHAUSTED / Quota limit reached\n        request_check --> HandleTransientError : 500 / 503 / Network Timeout\n\n        RecordSuccess --> IncrementKeyMetrics : Update successes count & latency in memory\n        IncrementKeyMetrics --> PersistUsageJSON : safeWriteJsonAtomic(gemini_key_usage.json)\n        PersistUsageJSON --> QueueReady : Retain position at Head (Key stays active)\n\n        HandleTransientError --> RetryTransient : Exponential backoff (Up to 3 retries on same key)\n        RetryTransient --> ExecuteAPIRequest\n\n        HandleQuotaError --> DemoteKeyToBottom : Mark key EXHAUSTED for remainder of UTC day\n        DemoteKeyToBottom --> ShiftNextKeyToHead : Key 1 pushed to end of FIFO queue; Key 2 promoted to Head\n        ShiftNextKeyToHead --> CheckPoolAvailability\n\n        state pool_check <<choice>>\n        CheckPoolAvailability --> pool_check\n        pool_check --> ExecuteAPIRequest : Next active key available -> Execute immediately!\n        pool_check --> AllKeysExhaustedLockout : 0 active keys remaining in pool (All Exhausted)\n    }\n\n    state \"AllKeysExhausted Lockout & UTC Rollover\" as LockoutState {\n        AllKeysExhaustedLockout --> SleepUntilUTCMidnight : Calculate seconds until 00:00:00 UTC (Local rule fallback active)\n        SleepUntilUTCMidnight --> TriggerUTCRollover : UTC Midnight reached\n        TriggerUTCRollover --> ResetCounters : Restore all pool keys to ACTIVE\n    }"},{"id":"doc_07","cat":"fromDocs","name":"7. Multi config boq preprocessing","file":"07_multi_config_boq_preprocessing.md","code":"graph TD\n    subgraph \"Raw Customer Input\"\n        RAW[\"Customer Quotation File<br/>(Excel Workbook / CSV / OCR TSV)\"]\n    end\n\n    subgraph \"Stage 1: Multi-Sheet & Preamble Extraction\"\n        SHEETS[\"Iterate Sheets & Strip Headers<br/>• Skip quote preambles (Customer name, validity date, terms)<br/>• Align column offsets (Product #, Description, Qty, Price)\"]\n    end\n\n    subgraph \"Stage 2: SKU Tokenization & Parsing\"\n        TOKENIZE[\"Line Tokenizer & Separator Parser<br/>• Normalizes tabs, commas, pipes (|), and inline delimiters<br/>• Filters through isValidHpeSKU() regex (-B21 / Service SKU)<br/>• Extracts embedded quantities (e.g. '2x P74573-B21' -> Qty: 2)\"]\n    end\n\n    subgraph \"Stage 3: CTO Server Multiplier & Clustering Engine\"\n        DETECT_CHASSIS[\"Detect CTO Base Server SKUs<br/>(e.g., P73282-B21, P52534-B21, R0Q21A)\"]\n        CLUSTER[\"Cluster Sub-Configurations<br/>• Group components under respective chassis base nodes<br/>• Detect multi-node orders (e.g. Cluster of 4 identical DL380 nodes)\"]\n    end\n\n    subgraph \"Stage 4: Fractional Division & Improbability Anomaly Scoring\"\n        FRACTIONAL[\"CTO Multiplier Integer Division<br/>• 4 Nodes × 2 CPUs = 8 CPUs (Integer: Valid)<br/>• 4 Nodes × 6 DIMMs = 24 DIMMs (Integer: Valid)<br/>• 4 Nodes × 3 DIMMs = 0.75 DIMMs/node (Fractional Anomaly!)\"]\n        ANOMALY[\"Improbability Index & Quality Heuristics<br/>• Detects non-integer division per node<br/>• Detects cross-generation mixing (Gen11 CPU with Gen12 Chassis)\"]\n    end\n\n    subgraph \"Pre-Flight Verification Modal & Confirmation\"\n        AUTO_CONFIRM[\"High Confidence (>0.85)<br/>✅ Auto-proceed to Aspect Evaluation\"]\n        SPLIT_MODAL[\"Pre-Flight Inspection Modal (App.jsx)<br/>⚠️ Prompts user to confirm or edit multi-config split\"]\n        RULE_PERSIST[\"savePreprocessingRuleFeedback()<br/>Persists confirmed split patterns to deltas\"]\n    end\n\n    %% Flows\n    RAW --> SHEETS --> TOKENIZE --> DETECT_CHASSIS --> CLUSTER --> FRACTIONAL --> ANOMALY\n    ANOMALY -->|Clean Integer Division| AUTO_CONFIRM\n    ANOMALY -->|Fractional / Ambiguous Split| SPLIT_MODAL\n    SPLIT_MODAL --> RULE_PERSIST --> AUTO_CONFIRM"},{"id":"doc_08","cat":"fromDocs","name":"8. Agentic guardrail mcp loop","file":"08_agentic_guardrail_mcp_loop.md","code":"sequenceDiagram\n    autonumber\n    participant Evaluator as BOQ Engine (Low Confidence / Conflict)\n    participant Guardrail as Agentic Guardrail Loop (agentic_guardrail.js)\n    participant Gemini as Gemini 3.5 Flash LLM\n    participant MCP as MCP Tool Server (scripts/mcp_server.js)\n    participant NLM as Google NotebookLM\n    participant Simulator as Build Simulator (boq_evaluator.js)\n\n    Evaluator->>Guardrail: Trigger Guardrail (Items, Violations, Missing Fixes)\n    Guardrail->>Gemini: Prompt with Workload Context & Available MCP Tools\n\n    loop Autonomous Tool Execution Loop (Max 5 Iterations)\n        Gemini-->>Guardrail: Tool Call Request (JSON)\n        \n        alt Tool: query_notebooklm(query)\n            Guardrail->>MCP: Call query_notebooklm\n            MCP->>NLM: Query Official QuickSpecs\n            NLM-->>MCP: Authoritative Technical Rule / Specification\n            MCP-->>Guardrail: Return Rule Content\n        else Tool: search_catalog(category, query)\n            Guardrail->>MCP: Call search_catalog\n            MCP->>MCP: Search live master catalog JSON\n            MCP-->>Guardrail: Return Matching Verified SKUs & Prices\n        else Tool: simulate_build(modifiedSKUs)\n            Guardrail->>MCP: Call simulate_build\n            MCP->>Simulator: Re-run 7-Aspect Math on Candidate BOM\n            Simulator-->>MCP: { isMathClean, confidenceScore, remainingErrors }\n            MCP-->>Guardrail: Return Simulation Outcome\n        end\n\n        Guardrail->>Gemini: Feed Tool Output Back to LLM Context\n    end\n\n    Gemini-->>Guardrail: Final Resolution Decision & Technical Reasoning\n    Guardrail->>Evaluator: Return 100% Buildable Validated BOM + Action Ledger"},{"id":"doc_09","cat":"fromDocs","name":"9. Six aspect hardware math hierarchy","file":"09_six_aspect_hardware_math_hierarchy.md","code":"graph TB\n    subgraph \"Aspect 1: Compute & Thermal Math (compute_thermal.js)\"\n        C1[\"CPU Socket Count = Σ(Processor Qty)\"]\n        C2[\"Max CPU TDP Watts = Max(Regex TDP)\"]\n        C3[\"Rule: If Max TDP >= 240W & No High-Perf Fans<br/>❌ FAIL -> Inject High-Perf Fan Kit (P48820-B21)\"]\n        C4[\"Rule: If TDP >= 185W -> Mandate Performance Heatsink Kit (P74792-B21)\"]\n    end\n\n    subgraph \"Aspect 2: Memory Channel Symmetry (memory_channel.js)\"\n        M1[\"Total DIMM Count = Σ(Memory Qty)\"]\n        M2[\"Total RAM GB = Σ(Capacity GB × Qty)\"]\n        M3[\"Rule: 1DPC / 2DPC Channel Symmetry<br/>(DIMMs % CPUs == 0) && ((DIMMs / CPUs) % 8 == 0)\"]\n        M4[\"Rule: Mutual Exclusion<br/>• No mixing x4 and x8 DIMMs<br/>• 96GB DIMMs isolated from other capacities\"]\n    end\n\n    subgraph \"Aspect 3: Storage Tri-Mode & Battery (storage_tri_mode.js)\"\n        S1[\"Drive Count = Σ(NVMe / SAS / SATA Drive Qty)\"]\n        S2[\"Rule: If Tri-Mode Controller (MR416i / SR932i) Present<br/>❌ FAIL without Smart Storage Battery (P01366-B21)\"]\n        S3[\"Rule: If Drive Count == 0 & No Front Cage<br/>Mandate No Drive Configuration FIO Kit (873763-B21)\"]\n    end\n\n    subgraph \"Aspect 4: PCIe Expansion & Riser Math (pcie_riser.js)\"\n        P1[\"Required Add-In Cards = Σ(NICs, HBAs, GPUs, Controllers)\"]\n        P2[\"Available Motherboard Base Slots = 3\"]\n        P3[\"Riser Capacity = (Primary × 3) + (Secondary × 3) + (Tertiary × 2)\"]\n        P4[\"Rule: Secondary / Tertiary Risers REQUIRE 2nd CPU Socket\"]\n    end\n\n    subgraph \"Aspect 5: Power & Environment (power_environment.js)\"\n        PW1[\"PSU Count = Σ(Power Supply Qty)\"]\n        PW2[\"Rule: N+1 Redundancy Warning if PSU Count == 1 per node\"]\n        PW3[\"Rule: If -48VDC Telco PSU present<br/>Mandate DC Power Cable Lug Kit (P36877-B21)\"]\n        PW4[\"Rule: No mixing AC and DC power supplies\"]\n    end\n\n    subgraph \"Aspect 6: Networking & OCP 3.0 (networking_ocp.js)\"\n        N1[\"OCP Adapter Count = Σ(OCP 3.0 NIC Qty)\"]\n        N2[\"Max OCP Slots = 2 per node (from Catalog constraint)\"]\n        N3[\"Rule: OCP Adapter Count <= Max OCP Slots\"]\n        N4[\"Calculate Total Active Network Ports across 1G/10G/25G/100G\"]\n    end\n\n    subgraph \"Aspect 7: Support & Services SLA (support_manufacturing.js)\"\n        SP1[\"Service SKU Count = Σ(Pointnext / Tech Care SKUs)\"]\n        SP2[\"Rule: Enterprise Quotes mandate minimum 3-Year Foundation Care or Tech Care Essential SLA\"]\n        SP3[\"Rule: Service Duration & Chassis Form Factor Match\"]\n    end\n\n    %% Dependencies\n    C1 --> M3\n    C1 --> P4\n    C2 --> C3 & C4\n    M1 --> M3 & M4\n    S1 --> S3\n    S2 --> S1\n    P1 --> P3\n    PW1 --> PW2 & PW3 & PW4\n    N1 --> N3\n    C1 --> SP2"},{"id":"doc_10","cat":"fromDocs","name":"10. Chaos and adversarial red teaming","file":"10_chaos_and_adversarial_red_teaming.md","code":"graph TD\n    subgraph \"Adversarial Red-Teaming Agent (scripts/adversarial_agent.js)\"\n        ADV[\"Continuous Red-Team Loop<br/>(Simulates corrupted BOQs, missing SKUs & extreme configurations)\"]\n        MUTATE[\"Mutation Engine<br/>• Strip mandatory fan kits<br/>• Inject cross-generation CPUs<br/>• Mix x4 and x8 DDR5 memory<br/>• Omit RAID cache batteries<br/>• Overload PCIe riser lanes\"]\n    end\n\n    subgraph \"Failure Injection & Chaos Scenarios\"\n        C1[\"Chaos 1: Cloud NotebookLM Outage<br/>(Simulates CLI failure / offline network)\"]\n        C2[\"Chaos 2: Gemini 429 Quota Exhaustion<br/>(Simulates entire API key pool depleted)\"]\n        C3[\"Chaos 3: Corrupted Knowledge Deltas<br/>(Simulates malformed JSON on disk)\"]\n        C4[\"Chaos 4: Frankenstein Chaos BOQ<br/>(Simulates multi-violation RFPs)\"]\n        C5[\"Chaos 5: Fractional Division Anomaly<br/>(Simulates odd item distribution)\"]\n        C6[\"Chaos 6: File System Interruption<br/>(Simulates mid-write process crashes)\"]\n    end\n\n    subgraph \"Resilience Fallbacks & Safety Nets\"\n        F1[\"Local Dual-Layer RAG Search<br/>(Seamless instant fallback without throwing)\"]\n        F2[\"FIFO Key Queue Quota Lockout Cooldown<br/>(Calculates seconds until UTC rollover)\"]\n        F3[\"Generic Safe Delta Ingestion Fallback\"]\n        F4[\"Mandatory HITL Review Trigger (Score < 0.75)\"]\n        F5[\"Improbability Index Human Confirmation Modal\"]\n        F6[\"safeWriteJsonAtomic() Temporary File Swapping\"]\n    end\n\n    subgraph \"Observability & Telemetry Verification\"\n        LEDGER[\"pipeline_telemetry.json<br/>Logs failure modes, fallback usage & confidence scores\"]\n        BENCHMARK[\"Automated Regression Benchmark<br/>(test_boq_eval_benchmarks.js)\"]\n    end\n\n    %% Flows\n    ADV --> MUTATE\n    MUTATE --> C1 & C2 & C3 & C4 & C5 & C6\n    C1 --> F1\n    C2 --> F2\n    C3 --> F3\n    C4 --> F4\n    C5 --> F5\n    C6 --> F6\n    F1 & F2 & F3 & F4 & F5 & F6 --> LEDGER\n    LEDGER --> BENCHMARK"},{"id":"doc_11","cat":"fromDocs","name":"11. Master macro orchestration flow","file":"11_master_macro_orchestration_flow.md","code":"graph LR\n    subgraph \"Stage 1: OCA Catalog Scraper\"\n        S1[\"Live Scraping via CDP port 9222<br/>Outputs: {Model}_Catalog.json + Master Excel\"]\n    end\n\n    subgraph \"Stage 2: Knowledge Sync\"\n        S2[\"Build Markdown Payload & Delta Sync<br/>Outputs: Google NotebookLM RAG + Local RAG\"]\n    end\n\n    subgraph \"Stage 3: Customer BOQ Engine\"\n        S3[\"6-Aspect Physical Math & 5-Tier Strategy Matrix<br/>Outputs: Corrected Multi-Sheet Excel BOM\"]\n    end\n\n    subgraph \"Stage 4: Grounded AI Consultation\"\n        S4[\"Agentic MCP Guardrail & QuickSpecs Grounding<br/>Outputs: Verified Hardware Rules & Technical Insights\"]\n    end\n\n    subgraph \"Stage 5: HITL Verification Trial\"\n        S5[\"Partner Portal Verification & Quote Submission<br/>Outputs: Acceptance or CLIC Error Code\"]\n    end\n\n    subgraph \"Stage 6: Autonomous Feedback Learning\"\n        S6[\"Capture Error & Dynamic Rule Ingestion<br/>Outputs: catalog_deltas.json + Auto-Sync\"]\n    end\n\n    %% Lifecycle Loop\n    S1 -->|Catalog Data| S2\n    S2 -->|Grounded Rules| S3\n    S3 -->|Validated BOM| S4\n    S4 -->|Optimized Quote| S5\n    S5 -->|Portal Error / Feedback| S6\n    S6 -->|Self-Healing Loop| S2\n    S6 -.->|Auto-Fix Next Run| S3"},{"id":"code_01","cat":"fromCode","name":"1. Backend api and routes architecture","file":"01_backend_api_and_routes_architecture.md","code":"graph TB\n    subgraph \"Express Server Core (dashboard/server.cjs)\"\n        APP[\"Express Application Instance<br/>PORT 3000 / 5173\"]\n        CORS[\"CORS Middleware\"]\n        JSON_BODY[\"express.json({ limit: '50mb' })\"]\n        STATIC[\"Vite SPA Static File Server<br/>(dashboard/dist/)\"]\n    end\n\n    subgraph \"Middlewares & Services (dashboard/services/)\"\n        PATH_GUARD[\"PathGuard Service (pathGuard.cjs)<br/>assertSafePath() Directory Traversal Protection\"]\n        TASK_MGR[\"TaskManager Service (taskManager.cjs)<br/>isTaskRunning(), activeTask Mutex, SSE Registry\"]\n        ERR_HANDLER[\"ErrorHandler Middleware (errorHandler.cjs)<br/>Standardized JSON Error Envelopes\"]\n    end\n\n    subgraph \"Modular Route Handlers (dashboard/routes/)\"\n        R_CATALOG[\"Catalogs Route (catalogs.cjs)<br/>• GET /api/catalogs<br/>• GET /api/chassis-list<br/>• POST /api/audit-catalog\"]\n        R_EVAL[\"Evaluation Route (evaluation.cjs)<br/>• POST /api/upload-boq<br/>• POST /api/preprocess-boq<br/>• POST /api/eval-boq<br/>• POST /api/export-boq\"]\n        R_SCRAPE[\"Scraper Route (scraper.cjs)<br/>• POST /api/scrape-solution<br/>• POST /api/build-catalog<br/>• POST /api/launch-browser\"]\n        R_TASKS[\"Tasks & Stream Route (tasks.cjs)<br/>• GET /api/stream-logs (SSE)<br/>• GET /api/task-status<br/>• POST /api/kill-task\"]\n        R_NOTEBOOK[\"Notebook Route (notebook.cjs)<br/>• POST /api/notebook-query<br/>• POST /api/sync-knowledge<br/>• GET /api/rag-diagnostics\"]\n        R_FEEDBACK[\"Feedback Route (feedback.cjs)<br/>• POST /api/feedback<br/>• GET /api/feedback/queue\"]\n        R_TELEMETRY[\"Telemetry Route (telemetry.cjs)<br/>• GET /api/telemetry<br/>• GET /api/history/runs/:id\"]\n    end\n\n    subgraph \"Backend Engine Layer (scripts/lib/)\"\n        LIB[\"Master Loose-Coupling Barrel (scripts/lib/index.js)<br/>system, boq, catalog, rag, scraper, feedback\"]\n    end\n\n    %% Wiring\n    APP --> CORS --> JSON_BODY\n    JSON_BODY --> PATH_GUARD --> ERR_HANDLER\n    ERR_HANDLER --> R_CATALOG & R_EVAL & R_SCRAPE & R_TASKS & R_NOTEBOOK & R_FEEDBACK & R_TELEMETRY\n    R_TASKS <--> TASK_MGR\n    R_EVAL <--> TASK_MGR\n    R_SCRAPE <--> TASK_MGR\n    R_CATALOG & R_EVAL & R_SCRAPE & R_NOTEBOOK & R_FEEDBACK & R_TELEMETRY --> LIB\n    APP --> STATIC"},{"id":"code_02","cat":"fromCode","name":"2. Task manager mutex and sse streaming","file":"02_task_manager_mutex_and_sse_streaming.md","code":"sequenceDiagram\n    autonumber\n    actor Client as Frontend Client (React)\n    participant Route as Express Route (/api/eval-boq)\n    participant TaskMgr as TaskManager (taskManager.cjs)\n    participant Child as Spawned Child Process (node eval_boq.js)\n    participant SSE as SSE Channel (/api/stream-logs)\n    participant FS as File System (outputs/history/runs/)\n\n    Note over Client,SSE: 1. SSE Connection Establishment\n    Client->>SSE: GET /api/stream-logs (Accept: text/event-stream)\n    SSE->>TaskMgr: addSseClient(res)\n    TaskMgr-->>Client: Headers: 200 OK (Keep-Alive, SSE Handshake)\n\n    Note over Client,TaskMgr: 2. Task Trigger & Mutex Guard\n    Client->>Route: POST /api/eval-boq { rawText, chassisDir }\n    Route->>TaskMgr: isTaskRunning()\n    alt activeTask != null && process is alive\n        TaskMgr-->>Route: true\n        Route-->>Client: 409 Conflict: \"Another task is currently running\"\n    else activeTask == null || process exited\n        TaskMgr-->>Route: false (Mutex Available)\n        Route->>Child: spawn('node', ['scripts/eval_boq.js', ...])\n        Route->>TaskMgr: _setActiveTask({ type, runId, pid, proc, startTime })\n        Route-->>Client: 202 Accepted { status: 'ACCEPTED', runId }\n        TaskMgr->>SSE: broadcastSSE({ type: 'TASK_STARTED', task: 'EVAL_BOQ', runId })\n        SSE-->>Client: data: {\"type\":\"TASK_STARTED\",...}\\n\\n\n    end\n\n    Note over Child,TaskMgr: 3. Unbroken Line Buffering & Event Streaming\n    loop Child Output Streaming\n        Child->>Route: proc.stdout / proc.stderr (Raw Chunks)\n        Route->>Route: Split by newline (\\n) & preserve chunk remainder in buffer\n        alt Structured Progress Log\n            Route->>SSE: broadcastSSE({ type: 'PROGRESS', step, total, label })\n            SSE-->>Client: data: {\"type\":\"PROGRESS\",...}\\n\\n\n        else Plain Text Log Line\n            Route->>SSE: broadcastSSE({ type: 'LOG', text, stream: 'stdout' })\n            SSE-->>Client: data: {\"type\":\"LOG\",...}\\n\\n\n        end\n    end\n\n    Note over Child,FS: 4. Process Exit, Extraction & Trace Persistence\n    Child->>Route: proc.on('close', code)\n    Route->>Route: Extract __EVAL_RESULT_JSON__ markers from stdout\n    Route->>Route: safeParseEvalResult(parsedData.data) (Zod Validation)\n    Route->>SSE: broadcastSSE({ type: 'EVAL_RESULT', data: validatedPayload, runId })\n    SSE-->>Client: data: {\"type\":\"EVAL_RESULT\",...}\\n\\n\n    Route->>TaskMgr: broadcastSSE({ type: 'TASK_COMPLETED', code, runId, durationMs })\n    SSE-->>Client: data: {\"type\":\"TASK_COMPLETED\",...}\\n\\n\n    Route->>FS: Write outputs/history/runs/{runId}.json (Full Audit Trace)\n    Route->>TaskMgr: _setActiveTask(null) (Mutex Released)"},{"id":"code_03","cat":"fromCode","name":"3. Library subsystems and barrel structure","file":"03_library_subsystems_and_barrel_structure.md","code":"graph TB\n    subgraph \"Master Loose-Coupling Barrel (scripts/lib/index.js)\"\n        ROOT[\"module.exports\"]\n    end\n\n    subgraph \"1. System Subsystem (scripts/lib/system/)\"\n        S_TEL[\"telemetry.js<br/>(System Telemetry & KPI Counters)\"]\n        S_FS[\"fs_compat.js<br/>(safeWriteJsonAtomic & Backups)\"]\n        S_PROG[\"progress.js<br/>(Structured Progress Emitter)\"]\n        S_LOG[\"pipeline_logger.js<br/>(Structured JSON Logger)\"]\n        S_PROF[\"profile_loader.js<br/>(Dynamic JSON Profile Loader)\"]\n        S_ROT[\"gemini_rotator.js<br/>(FIFO Key Rotator & Quota Manager)\"]\n        S_SCH[\"schemas.js<br/>(Canonical Zod Schemas & Safe Parsers)\"]\n    end\n\n    subgraph \"2. BOQ Engine Subsystem (scripts/lib/)\"\n        B_EVAL[\"boq_evaluator.js<br/>(7-Aspect Physical Math Coordinator)\"]\n        B_PRE[\"boq_preprocessor.js<br/>(Tabular Parser & CTO Multipliers)\"]\n        B_PAR[\"boq_parser.js<br/>(Centralized Line & SKU Parser)\"]\n        B_CG[\"conflict_graph.js<br/>(5-Level Conflict Graph & DAG)\"]\n        B_OPT[\"budget_optimizer.js<br/>(Rank 5 CapEx Minimizer — Active: called from eval_boq.js)\"]\n        B_VBOM[\"vendor_bom_verifier.js<br/>(Partner Portal Cross-Verifier)\"]\n        B_XLSX[\"generate_boq_xlsx.js<br/>(Multi-Sheet Corrected Excel Exporter)\"]\n    end\n\n    subgraph \"3. Catalog Engine Subsystem (scripts/lib/)\"\n        C_RULES[\"catalog_rules.js<br/>(5-Level Rule Classifier & Loader)\"]\n        C_DISC[\"catalog_discovery.js<br/>(Dynamic Chassis Directory Discovery)\"]\n        C_FORM[\"catalog_formatter.js<br/>(SKU Normalization & Hierarchy Paths)\"]\n        C_DIFF[\"diff_catalog.js<br/>(Catalog Diffs & Price History Logs)\"]\n        C_META[\"product_meta.js<br/>(Chassis Meta & Component Role Classifier)\"]\n        C_SKU[\"sku.js<br/>(Centralized isValidHpeSKU Regex Engine)\"]\n        C_REG[\"registry.js & sync_registry.js<br/>(Master Portfolio Registry Synchronization)\"]\n        C_VAL[\"data_validator.js<br/>(Pre-Commit Quality & Constraint Validator)\"]\n        C_CHKSUM[\"checksum_diff.js<br/>(SHA-256 Incremental Hashing)\"]\n        C_VERS[\"sku_versioning.js<br/>(SKU Version History & Trail Audit)\"]\n    end\n\n    subgraph \"4. RAG & Multimodal AI Subsystem (scripts/lib/)\"\n        R_OCR[\"ocr_service.js<br/>(Gemini Vision OCR & Multimodal Ingestion)\"]\n        R_SYNC[\"knowledge_sync.js<br/>(NotebookLM RAG Sync Payload Builder)\"]\n        R_QUERY[\"notebook_query_utils.js<br/>(Natural Language Query Coordinator)\"]\n        R_LOCAL[\"local_rag_search.js<br/>(Offline Dual-Layer Fallback Search)\"]\n        R_POST[\"post_flow_sync.js<br/>(Post-Flow Knowledge Sync Hook)\"]\n        R_GUARD[\"agentic_guardrail.js<br/>(Autonomous MCP Guardrail Loop)\"]\n    end\n\n    subgraph \"5. Scraper Subsystem (scripts/lib/)\"\n        SC_CDP[\"cdp.js<br/>(Chrome DevTools Protocol Connection Manager)\"]\n        SC_DOM[\"dom_extract.js<br/>(DOM Table & Constraint Extraction)\"]\n        SC_NAV[\"navigate_oca.js<br/>(Smart Partner Portal Auto-Navigator)\"]\n    end\n\n    subgraph \"6. Feedback & Learning Subsystem (scripts/lib/)\"\n        F_LOOP[\"feedback_loop.js<br/>(HITL Feedback Capture & Rule Ingestion)\"]\n        F_QUEUE[\"feedback_queue.js<br/>(Asynchronous Learning Queue)\"]\n    end\n\n    %% Mappings\n    ROOT -->|system| S_TEL & S_FS & S_PROG & S_LOG & S_PROF & S_ROT & S_SCH\n    ROOT -->|boq| B_EVAL & B_PRE & B_PAR & B_CG & B_OPT & B_VBOM & B_XLSX\n    ROOT -->|catalog| C_RULES & C_DISC & C_FORM & C_DIFF & C_META & C_SKU & C_REG & C_VAL & C_CHKSUM & C_VERS\n    ROOT -->|rag| R_OCR & R_SYNC & R_QUERY & R_LOCAL & R_POST & R_GUARD\n    ROOT -->|scraper| SC_CDP & SC_DOM & SC_NAV\n    ROOT -->|feedback| F_LOOP & F_QUEUE"},{"id":"code_04","cat":"fromCode","name":"4. React frontend component hierarchy","file":"04_react_frontend_component_hierarchy.md","code":"graph TD\n    subgraph \"Root Component (dashboard/src/App.jsx)\"\n        APP[\"App.jsx<br/>(Main App Shell & Modals)\"]\n    end\n\n    subgraph \"Custom Hook Lifecycle Layer (dashboard/src/hooks/)\"\n        H_SSE[\"useSSEStream()<br/>(SSE Logs, Progress, Eval Result Event Consumer)\"]\n        H_RAG[\"useRagPoller()<br/>(Asynchronous Notebook Query Poller)\"]\n        H_CAT[\"useCatalogs()<br/>(Master Catalog & Chassis Portfolio Loader)\"]\n    end\n\n    subgraph \"Header & Control Subsystem (components/header/)\"\n        HDR[\"Header.jsx\"]\n        C_SEL[\"ChassisSelector.jsx<br/>(Dropdown for 6 Certified Product Lines)\"]\n        NAV_TABS[\"NavigationTabs.jsx<br/>(Overview, Quote Evaluator, Catalog Explorer, Reconciliation)\"]\n        S_SRCH[\"SmartSearchInput.jsx<br/>(Instant Keyboard-Driven SKU Filter)\"]\n    end\n\n    subgraph \"Quote Evaluator & Uploader (components/uploader/)\"\n        UPLOADER[\"BoqUploader.jsx<br/>(Dropzone, Presets, Fast Sample Loader)\"]\n        AUDIT_PRE[\"PreflightPipelineAudit.jsx<br/>(5-Stage Pre-Flight Verification)\"]\n        SPLIT_MODAL[\"MultiConfigSplitModal.jsx<br/>(Multi-Node Cluster Split Review)\"]\n        PROG_STEPS[\"EvaluationProgressSteps.jsx<br/>(Real-Time SSE Stage Cards)\"]\n    end\n\n    subgraph \"Strategy Resolution Matrix (components/matrix/)\"\n        RES_MATRIX[\"ResolutionMatrix.jsx<br/>(5-Tier Strategy Container)\"]\n        RANK_CARDS[\"RankCard.jsx<br/>(Rank 1 through Rank 5 Solution Cards)\"]\n        COMP_TABLE[\"MatrixComparisonTable.jsx<br/>(Hardware Rows & None Required Badges)\"]\n        TOOLBAR[\"MatrixToolbar.jsx<br/>(Excel Export, Partner Portal Push, Filter)\"]\n        REJECT_MODAL[\"RejectionModal.jsx<br/>(HITL Partner Portal Error Simulation)\"]\n    end\n\n    subgraph \"Summary, Workflow & Telemetry\"\n        SUM_HDR[\"ChassisHeaderSummary.jsx\"]\n        SUM_PORT[\"ChassisPortfolioTable.jsx\"]\n        STEPPER[\"WorkflowStepper.jsx & StepStageCard.jsx\"]\n        TEL_CARD[\"TelemetryCard.jsx & TelemetryDrawer.jsx\"]\n        DNA_CARD[\"WorkloadDnaCard.jsx\"]\n    end\n\n    subgraph \"Inspection Drawers & Modals\"\n        RAG_DRAWER[\"NotebookRagDrawer.jsx<br/>(Live QuickSpecs Ask Engine)\"]\n        FEED_DRAWER[\"UserFeedbackDrawer.jsx<br/>(HITL Feedback & Rule Capture)\"]\n        RUN_MODAL[\"RunDetailModal.jsx<br/>(Historical Run Trace Viewer)\"]\n        SETTINGS[\"SettingsDrawer.jsx\"]\n    end\n\n    %% Hierarchy\n    APP --> H_SSE & H_RAG & H_CAT\n    APP --> HDR\n    HDR --> C_SEL & NAV_TABS & S_SRCH\n    APP --> UPLOADER\n    UPLOADER --> AUDIT_PRE & SPLIT_MODAL & PROG_STEPS\n    APP --> DNA_CARD\n    APP --> RES_MATRIX\n    RES_MATRIX --> RANK_CARDS & COMP_TABLE & TOOLBAR & REJECT_MODAL\n    APP --> SUM_HDR & SUM_PORT & STEPPER & TEL_CARD\n    APP --> RAG_DRAWER & FEED_DRAWER & RUN_MODAL & SETTINGS"},{"id":"code_05","cat":"fromCode","name":"5. Conflict dag and rule engine","file":"05_conflict_dag_and_rule_engine.md","code":"graph TD\n    subgraph \"Rule Classification Engine (catalog_rules.js)\"\n        R_CLASS[\"classifyRule(rawRuleText, subCategory)<br/>Regex & Lexical Parser\"]\n        L1[\"Level 1: VENDOR<br/>(BTO vs CTO Mode Exclusions)\"]\n        L2[\"Level 2: CHASSIS<br/>(Form Factor Gates: 8SFF vs 24SFF vs EDSFF)\"]\n        L3[\"Level 3: CATEGORY<br/>(Mutual Exclusions: x4/x8 Mixing, AC/DC Mixing)\"]\n        L4[\"Level 4: SUBCATEGORY<br/>(Controller, Riser, Fan Slot Dependencies)\"]\n        L5[\"Level 5: SKU<br/>(Exact Part # Co-requisites & Mandatory Fixes)\"]\n    end\n\n    subgraph \"Chassis Variant Detection Engine (conflict_graph.js)\"\n        DETECT[\"detectChassisVariant(items, overrideVariant)<br/>• Matches direct base chassis SKUs (e.g. P73282-B21)<br/>• Extracts form-factor (8SFF / 24SFF / EDSFF)<br/>• Loads chassis_map.json configurations\"]\n    end\n\n    subgraph \"Directed Acyclic Graph (DAG) Evaluator (validateConflictGraph)\"\n        FULL_BOM[\"Unified BOM Map<br/>(Base Items + Injected Fix SKUs)\"]\n        LEARNED_CHECK[\"0. Learned Knowledge Deltas Gate<br/>(Checks master_knowledge_registry.json)\"]\n        CHASSIS_GATE[\"1. Chassis Form Factor Gate<br/>(e.g., EDSFF parts rejected on SFF chassis)\"]\n        MUTUAL_EXCLUDE[\"2. Category Mutual Exclusion Gate<br/>• Memory x4 vs x8 bit-width mixing<br/>• 96GB capacity isolation<br/>• AC vs DC Power Supply mixing\"]\n        CASCADE_FIX[\"3. Cascading Fix Resolution Gate<br/>• High-TDP Thermal Fan Injection (P48820-B21)<br/>• Smart Storage Battery Pairing (P01366-B21)<br/>• DC Cable Lug Kit Pairing (P36877-B21)\"]\n    end\n\n    subgraph \"Evaluation Outcome\"\n        CLEAN[\"isWholeSolutionValid: true<br/>conflicts: [] (Zero Violations)\"]\n        CONFLICTS[\"isWholeSolutionValid: false<br/>conflicts: [ { level, type, message } ]\"]\n        CONFIDENCE[\"Confidence Score Calculation<br/>score = 1.0 - (errors × 0.15) - (conflicts × 0.10) - (warnings × 0.05)\"]\n    end\n\n    %% Flow\n    R_CLASS --> L1 & L2 & L3 & L4 & L5\n    DETECT --> FULL_BOM\n    L1 & L2 & L3 & L4 & L5 --> FULL_BOM\n    FULL_BOM --> LEARNED_CHECK --> CHASSIS_GATE --> MUTUAL_EXCLUDE --> CASCADE_FIX\n    CASCADE_FIX --> CLEAN\n    CASCADE_FIX --> CONFLICTS\n    CLEAN & CONFLICTS --> CONFIDENCE"},{"id":"code_06","cat":"fromCode","name":"6. Cdp browser automation and dom extraction","file":"06_cdp_browser_automation_and_dom_extraction.md","code":"sequenceDiagram\n    autonumber\n    participant Script as Scraper / CLI (scrape_oca_solution.js)\n    participant CDP as CDP Manager (scripts/lib/cdp.js)\n    participant Chrome as Google Chrome Instance (Port 9222)\n    participant DOM as DOM Extractor (scripts/lib/dom_extract.js)\n    participant Nav as Navigator (scripts/lib/navigate_oca.js)\n    participant Out as Staging Output\n\n    Script->>CDP: getOCATarget('http://127.0.0.1:9222')\n    CDP->>Chrome: HTTP GET /json (Inspect active tabs)\n    Chrome-->>CDP: List of tab metadata & webSocketDebuggerUrls\n    CDP->>CDP: Find tab with URL containing 'partner.hpe.com' or 'oca'\n    CDP->>Chrome: connectWS(webSocketDebuggerUrl) (WebSocket Handshake)\n\n    Note over CDP,Chrome: Command Execution Subsystem (sendCommand)\n    Script->>CDP: sendCommand('Runtime.enable')\n    Script->>CDP: sendCommand('Page.enable')\n    Script->>CDP: sendCommand('DOM.enable')\n\n    Note over Nav,Chrome: Smart Modal & WebLogic Traversal\n    Script->>Nav: handleAutoDismissModals(cdp)\n    Nav->>CDP: Runtime.evaluate (Find \"Accept / Close / Proceed\" buttons)\n    CDP->>Chrome: Click modal action buttons\n\n    Note over DOM,Chrome: Deep Table & Hierarchy Extraction\n    Script->>DOM: extractOCACatalogData(cdp, options)\n    DOM->>CDP: Runtime.evaluate (Traverse Category Sections & Sub-tables)\n    CDP-->>DOM: Raw DOM Tables with Product #, Description, List Price, Constraints\n    \n    Note over DOM,Out: Transformation & Sanitization\n    DOM->>DOM: cleanBaseSKU() (Normalize Part Numbers)\n    DOM->>DOM: parseUsdPrice() (Coerce numeric floats)\n    DOM->>DOM: classifyOptionType() (Standard / CTO / Service)\n    DOM->>DOM: Build 4-level Hierarchy Paths (Chassis > Category > Subcat > SKU)\n    DOM->>Out: Return CatalogMasterSchema JSON Structure"},{"id":"code_07","cat":"fromCode","name":"7. Multimodal vision ocr pipeline","file":"07_multimodal_vision_ocr_pipeline.md","code":"graph TD\n    subgraph \"Image & PDF Upload\"\n        FILE[\"Input File (PNG / JPEG / WebP / PDF)<br/>Uploaded via /api/upload-boq\"]\n    end\n\n    subgraph \"Pre-Flight Validation & Size Guard\"\n        IS_IMAGE[\"isImageFile(filePath)<br/>Check file extension\"]\n        SIZE_CHECK[\"Payload Size Assertion<br/>• Standard Limit: 25 MB max<br/>• Reject corrupted/oversized files\"]\n        BASE64[\"Read & Convert File to Base64 Buffer\"]\n    end\n\n    subgraph \"Smart Key Rotation & Gemini Multimodal Client\"\n        ROTATOR[\"executeWithSmartRotation()<br/>(scripts/lib/gemini_rotator.js)\"]\n        PROMPT[\"Structured Tabular Extraction Prompt<br/>• Instructs model to output exact TSV rows<br/>• Product # | Description | Qty | Unit Price\"]\n        CALL[\"Gemini 3.5 Flash Multimodal Inference<br/>(inlineData: base64, mimeType)\"]\n    end\n\n    subgraph \"Post-Processing & SKU Extraction Engine\"\n        RAW_TEXT[\"Extracted Raw OCR Text Content\"]\n        LINE_PARSER[\"Parse Lines & Table Columns\"]\n        REGEX[\"Centralized isValidHpeSKU() Filter<br/>• Identifies hardware (-B21) and service SKUs<br/>• Filters out OCR artifacts & image noise\"]\n        STRUCTURED[\"Structured OCR Return Envelope<br/>{ text, detectedSkus, lineCount, modelUsed, durationMs }\"]\n    end\n\n    subgraph \"Downstream Ingestion\"\n        PREPROC[\"boq_preprocessor.js -> evaluatePhysicalMath()\"]\n    end\n\n    %% Flows\n    FILE --> IS_IMAGE --> SIZE_CHECK --> BASE64\n    BASE64 --> ROTATOR\n    PROMPT --> ROTATOR\n    ROTATOR --> CALL --> RAW_TEXT\n    RAW_TEXT --> LINE_PARSER --> REGEX --> STRUCTURED\n    STRUCTURED --> PREPROC"},{"id":"code_08","cat":"fromCode","name":"8. Master excel workbook generation pipeline","file":"08_master_excel_workbook_generation_pipeline.md","code":"graph TD\n    subgraph \"Input Data Modalities\"\n        CAT_JSON[\"Master Catalog JSON ({Model}_Catalog.json)\"]\n        EVAL_JSON[\"BOQ Evaluation Result (5-Tier Resolution Matrix)\"]\n    end\n\n    subgraph \"19-Sheet Master Catalog Workbook (scripts/generate_xlsx.js)\"\n        S_SUM[\"1. Category Summary (SKU tally & subcategory counts)\"]\n        S_ALL[\"2. All SKUs (Unified sorted master table)\"]\n        S_CTO[\"3. Chassis Variants (Base server variants & list prices)\"]\n        S_RULES[\"4. Rules & Constraints (5-level parsed rules)\"]\n        S_HW[\"5. Hardware Accessories (Physical hardware options)\"]\n     let panZoomInstance = null;
    let activeId = 'doc_01';

    function renderNav() {
      const nav = document.getElementById('navList');
      nav.innerHTML = '';

      const docItems = diagrams.filter(d => d.cat === 'fromDocs');
      const codeItems = diagrams.filter(d => d.cat === 'fromCode');

      const addGroup = (title, items) => {
        const header = document.createElement('div');
        header.className = 'nav-section-title';
        header.innerText = title;
        nav.appendChild(header);

        items.forEach(item => {
          const btn = document.createElement('button');
          btn.className = 'nav-item ' + (item.id === activeId ? 'active' : '');
          btn.id = 'nav_' + item.id;
          btn.innerText = item.name;
          btn.onclick = () => loadDiagram(item);
          nav.appendChild(btn);
        });
      };

      addGroup('📁 From Documentation (11)', docItems);
      addGroup('📁 From Source Code (11)', codeItems);
    }

    async function loadDiagram(item) {
      activeId = item.id;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeNav = document.getElementById('nav_' + item.id);
      if (activeNav) activeNav.classList.add('active');

      document.getElementById('activeTitle').innerText = item.name;
      document.getElementById('activeCategory').innerText = item.cat;

      if (panZoomInstance) {
        panZoomInstance.destroy();
        panZoomInstance = null;
      }

      const target = document.getElementById('mermaidTarget');
      target.removeAttribute('data-processed');
      target.innerHTML = item.code;
      
      try {
        await mermaid.run({ nodes: [target] });
        
        const svgEl = target.querySelector('svg');
        if (svgEl) {
          svgEl.style.width = '100%';
          svgEl.style.height = '100%';
          svgEl.style.maxWidth = 'none';
          
          panZoomInstance = svgPanZoom(svgEl, {
            zoomEnabled: true,
            controlIconsEnabled: false,
            fit: true,
            center: true,
            minZoom: 0.1,
            maxZoom: 20,
            zoomScaleSensitivity: 0.2
          });

          panZoomInstance.fit();
          panZoomInstance.center();
          panZoomInstance.zoomBy(0.9);
        }
      } catch (err) {
        console.error('Mermaid render error:', err);
      }
    }

    function fitToScreen() {
      if (panZoomInstance) {
        panZoomInstance.fit();
        panZoomInstance.center();
        panZoomInstance.zoomBy(0.9);
      }
    }

    function zoomIn() {
      if (panZoomInstance) panZoomInstance.zoomIn();
    }

    function zoomOut() {
      if (panZoomInstance) panZoomInstance.zoomOut();
    }

    function resetZoom() {
      if (panZoomInstance) {
        panZoomInstance.reset();
        panZoomInstance.fit();
        panZoomInstance.center();
      }
    }

    function filterDiagrams() {
      const query = document.getElementById('search').value.toLowerCase();
      diagrams.forEach(d => {
        const el = document.getElementById('nav_' + d.id);
        if (el) {
          el.style.display = d.name.toLowerCase().includes(query) ? 'block' : 'none';
        }
      });
    }

    renderNav();
    loadDiagram(diagrams[0]);
  </script>
